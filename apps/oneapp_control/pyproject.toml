[project]
name = "oneapp_control"
authors = [{ name = "Four Degree Labs", email = "hello@fourdegreelabs.com" }]
description = "OneApp control plane: tenants, shards, plans, credits and provisioning."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# Retention, promotion to cold storage, presigned restore links and the purge
# are all S3 object calls.
dependencies = ["boto3~=1.35"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<18.0.0"
