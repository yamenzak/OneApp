name = "oneapp-email-inbound"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# tenant slug -> {"url": "https://acme.4dl.app", "secret": "..."}
# Written by the control plane when a tenant is provisioned. KV rather than a
# lookup call so a control-plane outage does not bounce customer mail.
[[kv_namespaces]]
binding = "TENANTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# The one domain the platform routes. Every workspace shares it and the tenant
# rides in the local part — see src/routing.js for why.
MAIL_DOMAIN = "4dl.app"
MAX_ATTACHMENT_BYTES = "25000000"
