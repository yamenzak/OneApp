# Runs the logic that can be tested without a bench: signature verification,
# slug rules, retry backoff, Stripe form encoding. Anything needing the ORM
# belongs in Frappe's own test runner against a real site.
#
# "Without a bench" never meant without frappe-ui and without Frappe's source.
# For months it did, and 124 guards skipped here — including two that were
# broken and could not say so, because nothing ever reached their assertions.
# The setup step below is `.claude/hooks/session-start.sh`, the same script a
# web session runs, so there is one statement of what the guards need rather
# than two that agree for a while.

name: Tests

on:
  push:
    branches: [main, canary, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: |
            apps/oneapp/frontend/yarn.lock
            apps/oneapp_control/frontend/yarn.lock

      # Python packages, both SPAs' node_modules, and sparse checkouts of
      # frappe and erpnext for the source the guards read. Tracks their default
      # branch on purpose: these guards exist to notice upstream drifting —
      # `scripts/i18n.py` says a vendored copy "would be a snapshot that
      # silently goes stale" — so a red here can be somebody else's commit, and
      # that is the signal, not a fault.
      - name: Install what the guards read
        env:
          CLAUDE_CODE_REMOTE: "true"
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_ENV_FILE: ${{ runner.temp }}/guard_env
        run: |
          : > "$CLAUDE_ENV_FILE"
          ./.claude/hooks/session-start.sh
          # The hook writes shell `export` lines; $GITHUB_ENV wants bare pairs.
          . "$CLAUDE_ENV_FILE"
          echo "ONEAPP_BENCH=$ONEAPP_BENCH" >> "$GITHUB_ENV"

      # `-rs` lists every skip and its reason. This workflow spent months
      # skipping 124 guards without saying so once, and two of them were broken
      # the whole time — a skip nobody can see is how that happens, so the run
      # now prints what it did not check.
      - name: Run tests
        run: python -m pytest tests/ -q -rs

      - name: Validate doctype JSON
        run: python scripts/validate_doctypes.py

      # The two SPAs cannot share an npm workspace — each is mirrored to its own
      # repository — so their shared setup is generated. This is what stops the
      # copies drifting apart.
      - name: Check frontend config is in sync
        run: python scripts/check_frontend.py
