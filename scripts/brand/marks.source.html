<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One — icon workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101216;
    --panel:#181B21;
    --sunken:#0C0E12;
    --line:#282D37;
    --line-soft:#1F242C;
    --ink:#ECEEF2;
    --muted:#98A0AD;
    --dim:#6B7380;
    --sel:#6C8CFF;
    --radius:14px;
    --stage-bg:#0C0E12;
    --stage-line:rgba(255,255,255,.055);
    --stage-edge:#242932;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  :root[data-backdrop="light"]{ --stage-bg:#F1F2F4; --stage-line:rgba(15,18,24,.07); --stage-edge:#D5D8DE; }
  :root[data-backdrop="oled"]{ --stage-bg:#000000; --stage-line:rgba(255,255,255,.05); --stage-edge:#191919; }
  :root[data-backdrop="glass"]{ --stage-bg:#2A2440; --stage-line:rgba(255,255,255,.08); --stage-edge:#3A3358; }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:6px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:14px 22px;
    background:rgba(16,18,22,.88);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .brand span{font-size:13px;color:var(--dim)}

  .seg{display:flex;gap:2px;padding:3px;background:var(--sunken);border:1px solid var(--line-soft);border-radius:10px}
  .seg button{padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .12s,color .12s}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:#2B313C;color:#fff}
  .corner-ctl{gap:9px;padding:5px 11px;align-items:center}
  .corner-ctl label{font-size:13px;color:var(--muted)}
  .corner-ctl output{font-family:var(--mono);font-size:11px;color:var(--dim);width:22px;text-align:right}
  .corner-ctl input[type=range]{width:92px;accent-color:var(--sel);background:transparent}

  /* ---------- shell ---------- */
  .shell{
    max-width:1340px;margin:0 auto;padding:24px 22px 80px;
    display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:start;
  }
  @media (max-width:1080px){ .shell{grid-template-columns:minmax(0,1fr)} }

  /* ---------- contact sheet ---------- */
  .sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .sheet-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .sheet-head p{font-size:13px;color:var(--dim)}

  .sheet{
    background:var(--stage-bg);
    background-image:linear-gradient(var(--stage-line) 1px,transparent 1px),linear-gradient(90deg,var(--stage-line) 1px,transparent 1px);
    background-size:26px 26px;
    border:1px solid var(--stage-edge);border-radius:18px;
    padding:14px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;
    transition:background-color .18s,border-color .18s;
  }
  @media (max-width:520px){ .sheet{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))} }

  .cell{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:18px 8px 13px;border-radius:13px;
    border:1px solid transparent;text-align:center;
    transition:background .14s,border-color .14s;
  }
  .cell:hover{background:rgba(127,140,170,.09)}
  .cell[aria-selected="true"]{border-color:var(--sel);background:rgba(108,140,255,.11)}
  .cell .art{width:74px;height:74px;display:block}
  @media (max-width:520px){ .cell .art{width:60px;height:60px} }
  .cell .nm{font-size:12.5px;font-weight:600;letter-spacing:-.005em;line-height:1.2}
  .cell .rl{font-size:11px;color:var(--dim);line-height:1.25}
  :root[data-backdrop="light"] .cell .nm{color:#14171C}
  :root[data-backdrop="light"] .cell .rl{color:#666E7B}
  :root[data-backdrop="light"] .cell:hover{background:rgba(15,18,24,.05)}

  /* ---------- detail rail ---------- */
  .rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:16px}
  @media (max-width:1080px){ .rail{position:static} }

  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:18px;padding:18px}

  .stage{
    position:relative;aspect-ratio:1;width:100%;max-width:292px;margin:0 auto;
    border-radius:18px;border:1px solid var(--stage-edge);background:var(--stage-bg);
    background-image:linear-gradient(var(--stage-line) 1px,transparent 1px),linear-gradient(90deg,var(--stage-line) 1px,transparent 1px);
    background-size:26px 26px;
    display:grid;place-items:center;padding:30px;
    transition:background-color .18s,border-color .18s;
  }
  .stage .art{width:100%;height:100%}
  .keyline{position:absolute;inset:30px;pointer-events:none;display:none}
  .keyline.on{display:block}
  .keyline i{position:absolute;border:1px solid rgba(108,140,255,.45);display:block}
  .keyline .circ{inset:4%;border-radius:50%}
  .keyline .sq{inset:14%;border-radius:22%;border-color:rgba(255,110,170,.4)}
  .keyline .hz{left:0;right:0;top:50%;border:0;border-top:1px solid rgba(108,140,255,.3)}
  .keyline .vt{top:0;bottom:0;left:50%;border:0;border-left:1px solid rgba(108,140,255,.3)}

  .ruler{
    margin-top:14px;padding:13px 14px;border-radius:13px;
    background:var(--stage-bg);border:1px solid var(--stage-edge);
    display:flex;align-items:flex-end;justify-content:space-around;gap:8px;
    transition:background-color .18s,border-color .18s;
  }
  .tick{display:flex;flex-direction:column;align-items:center;gap:7px}
  .tick .art{display:block}
  .tick span{font-family:var(--mono);font-size:10px;color:var(--dim)}
  :root[data-backdrop="light"] .tick span{color:#7A828E}

  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .title-row h3{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .title-row .role{font-size:13px;color:var(--sel);font-weight:500;margin-top:2px}
  .chip{
    flex:none;font-size:11px;font-weight:600;color:var(--muted);
    padding:4px 9px;border:1px solid var(--line);border-radius:20px;white-space:nowrap;
  }
  .desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:11px}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .fact{background:var(--sunken);border:1px solid var(--line-soft);border-radius:11px;padding:9px 11px;min-width:0}
  .fact dt{font-size:11px;color:var(--dim);margin-bottom:2px}
  .fact dd{font-size:12.5px;font-weight:600;line-height:1.35}

  .vlabel{font-size:12px;color:var(--dim);margin-bottom:8px}
  .vars{display:flex;flex-wrap:wrap;gap:6px}
  .vars button{
    padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:500;
    border:1px solid var(--line);color:var(--muted);transition:.12s;
  }
  .vars button:hover{color:var(--ink);border-color:#3A414E}
  .vars button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}

  .actions{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:600;
    border:1px solid var(--line);transition:.12s;text-align:center;
  }
  .btn:hover{border-color:#3A414E;background:#20252E}
  .btn.primary{background:var(--sel);border-color:var(--sel);color:#fff}
  .btn.primary:hover{background:#5C7EF7}
  .code{
    display:none;margin-top:11px;width:100%;height:150px;resize:vertical;
    background:var(--sunken);border:1px solid var(--line-soft);border-radius:11px;
    color:var(--muted);font-family:var(--mono);font-size:11px;line-height:1.5;padding:11px;
  }
  .code.on{display:block}
  .said{font-size:12.5px;color:#7EE0AE;margin-top:9px;display:none}
  .said.on{display:block}

  /* ---------- dock ---------- */
  .dock-wrap{max-width:1340px;margin:0 auto;padding:0 22px 56px}
  .dock-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  .dock-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .dock-head p{font-size:13px;color:var(--dim)}
  .dock{
    border-radius:22px;border:1px solid var(--stage-edge);background:var(--stage-bg);
    padding:14px 18px;display:flex;align-items:center;justify-content:center;
    gap:clamp(8px,2.4vw,26px);flex-wrap:wrap;
    transition:background-color .18s,border-color .18s;
  }
  .dock button{width:52px;height:52px;border-radius:13px;transition:transform .14s}
  .dock button:hover{transform:translateY(-4px)}
  .dock .art{width:100%;height:100%;display:block}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>One icon workbench</h1>
    <span id="count-label">14 application marks</span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div class="seg" role="group" aria-label="Backdrop">
      <button data-bd="dark" aria-pressed="true">Dark</button>
      <button data-bd="light" aria-pressed="false">Light</button>
      <button data-bd="oled" aria-pressed="false">OLED</button>
      <button data-bd="glass" aria-pressed="false">Glass</button>
    </div>
    <div class="seg">
      <button id="keyline-btn" aria-pressed="false">Keylines</button>
      <button id="beacon-btn" aria-pressed="true">Beacon</button>
    </div>
    <div class="seg corner-ctl">
      <label for="corner">Corner</label>
      <input id="corner" type="range" min="2.4" max="9" step="0.1" value="4.6" aria-label="Chassis corner exponent">
      <output id="corner-val">4.6</output>
    </div>
  </div>
</header>

<div class="shell">
  <section>
    <div class="sheet-head">
      <h2>Contact sheet</h2>
      <p>Pick a mark to inspect it</p>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <aside class="rail">
    <div class="panel">
      <div class="stage">
        <div class="art" id="stage-art"></div>
        <div class="keyline" id="keyline"><i class="circ"></i><i class="sq"></i><i class="hz"></i><i class="vt"></i></div>
      </div>
      <div class="ruler" id="ruler"></div>
    </div>

    <div class="panel">
      <div class="title-row">
        <div>
          <h3 id="d-name">—</h3>
          <div class="role" id="d-role">—</div>
        </div>
        <span class="chip" id="d-cat">—</span>
      </div>
      <p class="desc" id="d-desc">—</p>
      <dl class="facts">
        <div class="fact"><dt>Palette</dt><dd id="d-palette">—</dd></div>
        <div class="fact"><dt>Form</dt><dd id="d-form">—</dd></div>
      </dl>
      <div id="variant-block" style="margin-top:16px;display:none">
        <div class="vlabel" id="variant-label">Alternates</div>
        <div class="vars" id="variant-btns"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="copy-btn">Copy SVG</button>
        <button class="btn" id="code-btn">Show code</button>
      </div>
      <div class="said" id="said">Copied to clipboard</div>
      <textarea class="code" id="code" readonly spellcheck="false"></textarea>
    </div>
  </aside>
</div>

<div class="dock-wrap">
  <div class="dock-head">
    <h2>Dock simulation</h2>
    <p>Checking optical mass against each other</p>
  </div>
  <div class="dock" id="dock"></div>
</div>

<script>
/* ==== ICON SYSTEM (data) ==== */
    const COMMON_FILTERS = `
      <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <linearGradient id="chassis-edge" x1="0.3" y1="0" x2="0.7" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      </linearGradient>
      <linearGradient id="beacon-grad" x1="0.12" y1="0" x2="0.88" y2="1">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="55%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
      <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
    `;

    let CHASSIS_N = 4.6;           // superellipse exponent: 2 = circle, 4.6 = squircle, 9 = soft square

    function squirclePath(cx, cy, halfW, n, halfH) {
      const hw = halfW, hh = (halfH === undefined ? halfW : halfH);
      const N = 48, p = [];
      for (let i = 0; i < N; i++) {
        const t = (i / N) * Math.PI * 2, c = Math.cos(t), sn = Math.sin(t);
        p.push([
          cx + Math.sign(c)  * Math.pow(Math.abs(c),  2 / n) * hw,
          cy + Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n) * hh
        ]);
      }
      const f = v => Math.round(v * 100) / 100;
      let d = `M ${f(p[0][0])} ${f(p[0][1])}`;
      for (let i = 0; i < N; i++) {
        const a = p[(i - 1 + N) % N], b = p[i], c = p[(i + 1) % N], e = p[(i + 2) % N];
        d += ` C ${f(b[0] + (c[0] - a[0]) / 6)} ${f(b[1] + (c[1] - a[1]) / 6)}` +
             ` ${f(c[0] - (e[0] - b[0]) / 6)} ${f(c[1] - (e[1] - b[1]) / 6)}` +
             ` ${f(c[0])} ${f(c[1])}`;
      }
      return d + ' Z';
    }

    // One chassis for the whole suite: superellipse body, plus a hairline that
    // catches light at the top and fades out at the bottom.
    const CHASSIS = (grad, half = 62) =>
      `<path d="${squirclePath(96, 96, half, CHASSIS_N)}" fill="url(#${grad})" filter="url(#soft-shadow)"/>` +
      `<path d="${squirclePath(96, 96, half - 0.9, CHASSIS_N)}" fill="none" stroke="url(#chassis-edge)" stroke-width="1.8"/>`;

    let currentWorkbookVariant = 'sum';
    let currentAiVariant = 'iris';
    let currentTaskVariant = 'breakout';
    let currentFitVariant = 'flame';
    let BEACON_ON = true;
    const BEACON_R = 8.5;
    const BEACON = (cx, cy, r = BEACON_R) => !BEACON_ON ? '' :
      `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#beacon-grad)"/>` +
      `<circle cx="${cx}" cy="${cy}" r="${(r * 0.4).toFixed(2)}" fill="#FFFFFF"/>`;

    let currentProjectVariant = 'scope';
    let currentCalendarVariant = 'pad';
    let currentCloudVariant = 'volume';
    let currentScratchVariant = 'torn';

    // OneCode — a shell prompt. Steel rather than a hue, because it is the one neutral
    // in the suite and reads as tooling. Deliberately not angle brackets: OneProject is
    // already a bracket mark in the same weight class.
    // OneSlide — the projected image itself: a keystoned trapezoid of light with the
    // beacon as the lamp at its source. Not a rectangle with a bar in it.
    // OneAdmin — one control node with tenants hung off it. The beacon is the node
    // itself: the single point everything else answers to.
    // OneDB — one cylinder, not a stack. The whole pitch is that the database is a single
    // file, so the beacon is that file sitting inside it.
    function getDbSvg() {
      return `<svg viewBox="0 0 192 192" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>${COMMON_FILTERS}
    <linearGradient id="db-body" x1="36" y1="46" x2="156" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#52627A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="db-cap" x1="40" y1="42" x2="152" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <path d="M 38 62 L 38 126 C 38 140 64 150 96 150 C 128 150 154 140 154 126 L 154 62 Z" fill="url(#db-body)" filter="url(#soft-shadow)"/>
  <ellipse cx="96" cy="62" rx="58" ry="22" fill="url(#db-cap)"/>
  <ellipse cx="96" cy="62" rx="22" ry="9" fill="#0B1220" fill-opacity="0.45"/>
  <ellipse cx="96" cy="62" rx="22" ry="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M 38 90 C 38 104 64 114 96 114 C 128 114 154 104 154 90" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round" fill="none"/>
  ${BEACON(96,62,7.5)}
</svg>`;
    }

    // OneFit — an adjustable dumbbell on the tilt. The beacon is the selector pin, the
    // part that decides the load; without it the plates are not on the bar.
    function getFitSvg(variant) {
      const FIT_GRADS = `
    <linearGradient id="fit-body" x1="30" y1="24" x2="162" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="42%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#701136"/>
    </linearGradient>
    <linearGradient id="fit-core" x1="76" y1="84" x2="118" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>`;

      // DUMBBELL — training only, kept for comparison.
      if (variant === 'dumbbell') {
        return `<svg viewBox="0 0 192 192" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>${COMMON_FILTERS}${FIT_GRADS}</defs>
  <g transform="rotate(-24 96 96)">
    <rect x="28" y="60" width="32" height="72" rx="11" fill="url(#fit-body)" filter="url(#soft-shadow)"/>
    <rect x="132" y="60" width="32" height="72" rx="11" fill="url(#fit-body)" filter="url(#soft-shadow)"/>
    <rect x="66" y="82" width="60" height="18" rx="9" fill="url(#fit-body)" filter="url(#soft-shadow)"/>
    <rect x="58" y="72" width="12" height="38" rx="6" fill="url(#fit-body)"/>
    <rect x="122" y="72" width="12" height="38" rx="6" fill="url(#fit-body)"/>
    ${BEACON(44,96)}
  </g>
</svg>`;
      }

      // PULSE — a heart with the trace cut through it.
      if (variant === 'pulse') {
        return `<svg viewBox="0 0 192 192" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>${COMMON_FILTERS}${FIT_GRADS}</defs>
  <path d="M 96 152 C 40 116 26 92 26 70 C 26 48 43 34 62 34 C 77 34 89 43 96 54 C 103 43 115 34 130 34 C 149 34 166 48 166 70 C 166 92 152 116 96 152 Z" fill="url(#fit-body)" filter="url(#soft-shadow)"/>
  <path d="M 38 84 L 68 84 L 80 62 L 98 110 L 110 84 L 142 84" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  ${BEACON(142,84)}
</svg>`;
      }

      // FLAME (default) — energy is the one currency both halves of the product trade in:
      // what a session burns and what a meal plan puts back. The beacon is the hot core,
      // which is the part of a flame that is actually doing the work.
      return `<svg viewBox="0 0 192 192" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>${COMMON_FILTERS}${FIT_GRADS}</defs>
  <path d="M 96 22 C 126 56 140 80 140 106 C 140 134 120 158 96 158 C 72 158 52 134 52 106 C 52 84 62 70 78 54 C 76 78 84 92 96 92 C 106 92 112 76 96 22 Z" fill="url(#fit-body)" filter="url(#soft-shadow)"/>
  <path d="M 96 92 C 112 110 120 122 120 132 C 120 145 109 154 96 154 C 83 154 72 145 72 132 C 72 122 80 110 96 92 Z" fill="url(#fit-core)"/>
  ${BEACON(96,130)}
</svg>`;
    }

    function getStudySvg() {
      return `<svg viewBox="0 0 192 192" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>${COMMON_FILTERS}
    <linearGradient id="std-board" x1="26" y1="34" x2="166" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0B4A5C"/>
    </linearGradient>
    <linearGradient id="std-cap" x1="58" y1="86" x2="134" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <path d="M 62 82 L 62 118 C 62 134 78 142 96 142 C 114 142 130 134 130 118 L 130 82 Z" fill="url(#std-cap)" filter="url(#subtle-shadow)"/>

/* ==== namespacing so repeated <defs> ids never collide ==== */
let nsCount = 0;
function ns(svg){
  const key = 'n' + (nsCount++);
  const ids = Array.from(svg.matchAll(/id="([^"]+)"/g)).map(m => m[1]);
  let out = svg;
  for (const id of new Set(ids)){
    out = out.split('id="' + id + '"').join('id="' + id + '--' + key + '"');
    out = out.split('url(#' + id + ')').join('url(#' + id + '--' + key + ')');
  }
  return out;
}
function paint(el, svg){ if (el) el.innerHTML = ns(svg); }

const DOCK_IDS = ['one','one-calendar','one-mail','one-cloud','one-writer','one-task','one-ai','one-people'];
const SIZES = [16, 24, 32, 48, 64];

let activeId = 'one-calendar';
let keylines = false;

const $ = s => document.querySelector(s);

function iconById(id){ return ICONS_SYSTEM.find(i => i.id === id); }
function clean(html){ return String(html).replace(/&bull;/g,'\u00B7'); }

/* ==== renderers ==== */
function renderSheet(){
  const sheet = $('#sheet');
  sheet.innerHTML = '';
  for (const it of ICONS_SYSTEM){
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.type = 'button';
    cell.dataset.id = it.id;
    cell.setAttribute('aria-selected', it.id === activeId);
    cell.innerHTML =
      '<span class="art"></span>' +
      '<span><span class="nm">' + it.name + '</span><br><span class="rl">' + it.role + '</span></span>';
    paint(cell.querySelector('.art'), it.getSvg());
    cell.addEventListener('click', () => select(it.id));
    sheet.appendChild(cell);
  }
  $('#count-label').textContent = ICONS_SYSTEM.length + ' application marks';
}

function renderDock(){
  const dock = $('#dock');
  dock.innerHTML = '';
  for (const id of DOCK_IDS){
    const it = iconById(id);
    if (!it) continue;
    const b = document.createElement('button');
    b.type = 'button';
    b.title = it.name;
    b.innerHTML = '<span class="art"></span>';
    paint(b.querySelector('.art'), it.getSvg());
    b.addEventListener('click', () => select(id));
    dock.appendChild(b);
  }
}

function renderRuler(svg){
  const ruler = $('#ruler');
  ruler.innerHTML = '';
  for (const px of SIZES){
    const t = document.createElement('div');
    t.className = 'tick';
    t.innerHTML = '<span class="art" style="width:' + px + 'px;height:' + px + 'px"></span><span>' + px + '</span>';
    paint(t.querySelector('.art'), svg);
    ruler.appendChild(t);
  }
}

function renderVariants(){
  const cfg = VARIANTS[activeId];
  const block = $('#variant-block');
  if (!cfg){ block.style.display = 'none'; return; }
  block.style.display = 'block';
  $('#variant-label').textContent = cfg.label;
  const wrap = $('#variant-btns');
  wrap.innerHTML = '';
  for (const [val, name] of cfg.options){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = name;
    b.setAttribute('aria-pressed', cfg.get() === val);
    b.addEventListener('click', () => { cfg.set(val); refreshAll(); });
    wrap.appendChild(b);
  }
}

function renderDetail(){
  const it = iconById(activeId);
  if (!it) return;
  const svg = it.getSvg();
  paint($('#stage-art'), svg);
  renderRuler(svg);
  $('#d-name').textContent = it.name;
  $('#d-role').textContent = it.role;
  $('#d-cat').textContent = it.category;
  $('#d-desc').textContent = it.desc;
  $('#d-palette').textContent = clean(it.palette);
  $('#d-form').textContent = it.form;
  $('#code').value = svg;
  renderVariants();
  document.querySelectorAll('.cell').forEach(c => {
    c.setAttribute('aria-selected', c.dataset.id === activeId);
  });
}

function refreshAll(){
  nsCount = 0;
  renderSheet();
  renderDock();
  renderDetail();
}

function select(id){
  activeId = id;
  renderDetail();
  document.querySelectorAll('.cell').forEach(c => {
    c.setAttribute('aria-selected', c.dataset.id === id);
  });
}

/* ==== controls ==== */
document.querySelectorAll('[data-bd]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-backdrop', btn.dataset.bd);
    document.querySelectorAll('[data-bd]').forEach(b => b.setAttribute('aria-pressed', b === btn));
  });
});

$('#keyline-btn').addEventListener('click', function(){
  keylines = !keylines;
  $('#keyline').classList.toggle('on', keylines);
  this.setAttribute('aria-pressed', keylines);
});

$('#code-btn').addEventListener('click', function(){
  const on = $('#code').classList.toggle('on');
  this.textContent = on ? 'Hide code' : 'Show code';
  if (on) $('#code').select();
});

$('#copy-btn').addEventListener('click', async () => {
  const svg = iconById(activeId).getSvg();
  let ok = false;
  try { await navigator.clipboard.writeText(svg); ok = true; }
  catch (e) {
    const ta = $('#code');
    ta.classList.add('on');
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  }
  const said = $('#said');
  said.textContent = ok ? 'Copied to clipboard' : 'Clipboard blocked — the code is selected, press copy';
  said.classList.add('on');
  setTimeout(() => said.classList.remove('on'), 2600);
});

$('#beacon-btn').addEventListener('click', function(){
  BEACON_ON = !BEACON_ON;
  this.setAttribute('aria-pressed', BEACON_ON);
  refreshAll();
});

let cornerRaf = 0;
$('#corner').addEventListener('input', e => {
  CHASSIS_N = parseFloat(e.target.value);
  $('#corner-val').textContent = CHASSIS_N.toFixed(1);
  if (cornerRaf) cancelAnimationFrame(cornerRaf);
  cornerRaf = requestAnimationFrame(refreshAll);
});

document.documentElement.setAttribute('data-backdrop','dark');
refreshAll();
